<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veil · Camera</title>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">Veil <span>Camera</span></div>
    <nav class="nav">
      <a class="active" href="/camera">Camera</a>
      <a href="/pass">Pass</a>
      <a href="/console">Console</a>
    </nav>
  </div>
  <div id="degradeBanner" class="banner" hidden>
    Camera unavailable — using sample still. Demo still works.
  </div>
  <div class="wrap stack">
    <div class="btn-row">
      <button class="btn primary" id="btnStart">Start camera</button>
      <button class="btn" id="btnFallback">Use sample still</button>
      <button class="btn" id="btnAddPerson">Add person track</button>
      <button class="btn good" id="btnBindLatest">Scan / bind latest Pass</button>
      <button class="btn good" id="btnCapture">Capture clip</button>
    </div>
    <p class="small muted" id="camStatus">Starting…</p>

    <div class="grid-2">
      <div>
        <div class="pane pane-internal" id="paneInternal">
          <div class="label label-big label-internal">INTERNAL</div>
          <video id="vidInternal" autoplay playsinline muted></video>
          <img class="fallback" id="stillInternal" hidden alt="still" />
          <div id="boxesInternal"></div>
        </div>
      </div>
      <div>
        <div class="pane pane-public" id="panePublic">
          <div class="label label-big label-public">PUBLIC</div>
          <video id="vidPublic" autoplay playsinline muted></video>
          <img class="fallback" id="stillPublic" hidden alt="still" />
          <div id="boxesPublic"></div>
        </div>
      </div>
    </div>

    <div class="card stack">
      <h2>Person tracks</h2>
      <div id="trackList" class="mono small muted">No tracks yet.</div>
      <details class="small muted">
        <summary>Manual bind (optional)</summary>
        <label class="small muted">token_id</label>
        <input id="tokenInput" placeholder="paste token_id" />
        <button class="btn" id="btnBindManual" style="margin-top:0.5rem">Bind this token</button>
      </details>
    </div>
  </div>

  <script src="/camera.js" type="module"></script>
</body>
</html>
