<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Veil Pass" />
  <title>Veil · Pass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@450;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">Veil <span>Pass</span></div>
    <nav class="nav">
      <a href="/camera">Camera</a>
      <a class="active" href="/pass">Pass</a>
      <a href="/console">Console</a>
      <a href="/cue">Cue</a>
    </nav>
  </div>
  <div class="wrap stack">
    <div class="qr-wrap card pass-hero credential-card">
      <span class="section-label">Credential</span>
      <p class="small muted" style="margin:0">Your Pass for this event</p>
      <div class="policy-status">
        <span class="badge" id="publicBadge">—</span>
        <span class="badge" id="bindingBadge" style="margin-left:0.4rem">—</span>
      </div>
      <canvas id="qr"></canvas>
      <div class="subject" id="subject">No pass yet</div>
      <div class="mono small muted" id="tokenMeta"></div>
      <div class="token-copy-row">
        <code class="mono small" id="tokenFull">—</code>
        <button class="btn" id="btnCopy" type="button">Copy</button>
      </div>
      <p class="small muted" style="margin-top:0.75rem">
        <strong>Show QR at camera</strong> (auto-scans) or on Mac: tap face to bind. Crowd: each phone = one Pass.
      </p>
    </div>

    <div class="card stack pass-actions">
      <span class="section-label">Public livestream</span>
      <h2>What others may see</h2>
      <p class="small">Controls what the PUBLIC camera feed may show of you.</p>
      <div class="btn-row">
        <button class="btn good" id="btnAllow">Allow</button>
        <button class="btn warn" id="btnBlur">Blur me</button>
        <button class="btn bad" id="btnDeny">Deny</button>
      </div>
      <button class="btn bad block" id="btnRevoke">Revoke Pass</button>
      <button class="btn ghost block" id="btnNew">Get new Pass</button>
    </div>
  </div>
  <script src="/pass.js" type="module"></script>
</body>
</html>
